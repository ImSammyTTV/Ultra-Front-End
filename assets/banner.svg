<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Ultra Front End: your whole game library on one controller-friendly screen">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b1c"/>
      <stop offset="0.6" stop-color="#0d1f45"/>
      <stop offset="1" stop-color="#16346b"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9fc4ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9fc4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f1ff"/>
      <stop offset="1" stop-color="#9fb8e6"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a73"/>
      <stop offset="1" stop-color="#0f2450"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1d42"/>
      <stop offset="1" stop-color="#060f26"/>
    </linearGradient>
    <!-- the cover tiles: abstract colour, never real game art -->
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset="1" stop-color="#7a2a8c"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#46e3b7"/><stop offset="1" stop-color="#1f5f8f"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa9ff"/><stop offset="0.5" stop-color="#3b5bff"/><stop offset="1" stop-color="#151a5c"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#d1495b"/></linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b388ff"/><stop offset="1" stop-color="#3d2a7a"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="card"><rect width="1280" height="400" rx="24"/></clipPath>
    <clipPath id="selArt"><rect x="-70" y="-105" width="140" height="210" rx="10"/></clipPath>
    <style>
      .float { animation: float 4.5s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translate(1010px, 196px) rotate(-1.2deg); } 50% { transform: translate(1010px, 186px) rotate(1.2deg); } }
      .twinkle { animation: tw 3.2s ease-in-out infinite; }
      .twinkle.b { animation-delay: 1.1s; } .twinkle.c { animation-delay: 2.2s; }
      @keyframes tw { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
      .sweep { animation: sweep 5.5s ease-in-out infinite; }
      @keyframes sweep { 0%,50% { transform: translateX(-200px); } 100% { transform: translateX(220px); } }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#dbe7ff">
      <circle class="twinkle" cx="80" cy="44" r="1.6"/><circle class="twinkle b" cx="196" cy="92" r="1.2"/>
      <circle class="twinkle c" cx="330" cy="38" r="1.4"/><circle class="twinkle" cx="470" cy="70" r="1.1"/>
      <circle class="twinkle b" cx="610" cy="30" r="1.5"/><circle class="twinkle c" cx="700" cy="104" r="1"/>
      <circle class="twinkle" cx="1180" cy="40" r="1.3"/><circle class="twinkle b" cx="1240" cy="120" r="1.1"/>
      <circle class="twinkle c" cx="560" cy="150" r="1"/><circle class="twinkle" cx="40" cy="160" r="1.2"/>
    </g>

    <!-- moon -->
    <circle cx="676" cy="78" r="96" fill="url(#moonGlow)"/>
    <circle cx="676" cy="78" r="40" fill="url(#moon)"/>
    <circle cx="664" cy="69" r="7" fill="#8fa9d8" opacity="0.35"/>
    <circle cx="688" cy="91" r="4.5" fill="#8fa9d8" opacity="0.3"/>

    <!-- hills and trees, as on the home screen -->
    <path d="M0 290 C 140 240, 260 250, 380 275 S 640 235, 780 262 S 1060 230, 1280 258 L1280 400 L0 400 Z" fill="url(#hillFar)"/>
    <path d="M0 330 C 180 300, 360 318, 520 330 S 860 300, 1040 322 S 1200 316, 1280 312 L1280 400 L0 400 Z" fill="url(#hillNear)"/>
    <g fill="#050c20">
      <path d="M40 340 l14 -46 l14 46 z M62 344 l11 -34 l11 34 z"/>
      <path d="M1210 330 l15 -50 l15 50 z M1236 336 l11 -36 l11 36 z"/>
    </g>

    <!-- title -->
    <text x="72" y="178" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1">Ultra Front End</text>
    <text x="74" y="222" font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#b9cdf2">Every game you own. One screen. One controller.</text>
    <g font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#dce8ff">
      <rect x="74" y="246" width="112" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="130" y="268" text-anchor="middle">PC games</text>
      <rect x="196" y="246" width="114" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="253" y="268" text-anchor="middle">Emulators</text>
      <rect x="320" y="246" width="140" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="390" y="268" text-anchor="middle">In-game menu</text>
    </g>

    <!-- the home row: covers either side of the selected one, dimmed -->
    <g>
      <rect x="770" y="128" width="104" height="156" rx="9" fill="url(#c1)"/>
      <rect x="884" y="124" width="104" height="156" rx="9" fill="url(#c2)"/>
      <rect x="1104" y="124" width="104" height="156" rx="9" fill="url(#c4)"/>
      <rect x="1218" y="128" width="104" height="156" rx="9" fill="url(#c5)"/>
      <rect x="770" y="128" width="104" height="156" rx="9" fill="#050b1c" fill-opacity="0.5"/>
      <rect x="884" y="124" width="104" height="156" rx="9" fill="#050b1c" fill-opacity="0.3"/>
      <rect x="1104" y="124" width="104" height="156" rx="9" fill="#050b1c" fill-opacity="0.3"/>
      <rect x="1218" y="128" width="104" height="156" rx="9" fill="#050b1c" fill-opacity="0.5"/>
    </g>

    <!-- the selected cover: blue focus frame, glow, a slow float, and a light sweep -->
    <g class="float" transform="translate(1010 196)">
      <rect x="-80" y="-115" width="160" height="230" rx="16" fill="#3aa0ff" filter="url(#glow)" class="pulse"/>
      <rect x="-76" y="-111" width="152" height="222" rx="14" fill="none" stroke="#5cb6ff" stroke-width="4"/>
      <g clip-path="url(#selArt)">
        <rect x="-70" y="-105" width="140" height="210" fill="url(#c3)"/>
        <circle cx="26" cy="-46" r="34" fill="#ffffff" fill-opacity="0.18"/>
        <path d="M-70 60 C -30 30, 10 70, 70 30 L70 105 L-70 105 Z" fill="#0b1240" fill-opacity="0.55"/>
        <rect class="sweep" x="-60" y="-105" width="60" height="210" fill="url(#shine)" transform="skewX(-18)"/>
      </g>
    </g>
  </g>
</svg>
