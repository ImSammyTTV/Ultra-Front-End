# Dev build: every push to the dev branch builds the exe, checks it starts, and saves it as the "dev" draft release
# (replacing the previous one), so a change can be tried on a PC before it goes into main. Branches: main (the releases
# and nightly builds) and dev (these).
# A draft is private: only the project's owner sees it on the Releases page. (No copy is kept on the run: on a public
# repo anyone signed in to GitHub can download a run's files.)
# Download UltraFrontEnd.exe from the draft once, add a GitHub token in its Settings › About, and it updates itself after
# that. Actions › Dev build › Run workflow builds again on demand.
# A dev build updates itself to each newer dev build (server.py: the "dev" channel), and only to them. No other copy of
# the app ever installs one: those read only the main releases and the "nightly" tag.
name: Dev build

on:
  push:
    branches: [dev]
    paths-ignore: ["stats/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write  # to replace the dev draft release

concurrency:
  group: dev
  cancel-in-progress: true  # a newer push makes the build under way pointless

jobs:
  dev:
    if: github.ref == 'refs/heads/dev'  # a manual run from another branch publishes nothing
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        id: build
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r tools/build-requirements.txt
          version=$(python tools/nightly.py version dev)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python -m PyInstaller --noconfirm --clean "Game Frontend.spec"
          cp "dist/Game Frontend.exe" dist/UltraFrontEnd.exe

      - name: Check it starts
        run: python tools/nightly.py smoke "dist/UltraFrontEnd.exe"


      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.build.outputs.version }}"
          branch="${GITHUB_REF_NAME}"
          sha=$(git rev-parse --short HEAD)
          title="Ultra Front End Dev build ($sha)"
          git fetch -q --depth=50 origin main 2>/dev/null || true  # for the list of what this branch adds
          {
            echo "Dev build $version, made from the branch \`$branch\` at $sha, to try a change before it goes into main."
            echo "A dev build updates itself to each new dev build. To go back to Main, download the latest release."
            echo
            echo "Newest changes on this branch:"
            if git rev-parse -q --verify origin/main >/dev/null; then
              git log --no-merges --format='- %s' origin/main..HEAD | head -30
            else
              git log --no-merges --format='- %s' -10
            fi
            echo
            # for the updater, in case GitHub doesn't list the file's SHA-256 itself
            echo "SHA-256: $(sha256sum dist/UltraFrontEnd.exe | cut -d' ' -f1)"
          } > notes.md
          # GitHub sometimes answers a release request with a server error (HTTP 500): a few tries, a minute apart
          repo="$GITHUB_REPOSITORY"
          for try in 1 2 3 4; do
            # the previous dev builds go: drafts, and the public pre-release (and its tag) from before they were drafts
            for id in $(gh api "repos/$repo/releases?per_page=100" -q '.[] | select(.tag_name == "dev") | .id'); do
              gh api -X DELETE "repos/$repo/releases/$id" || true
            done
            gh api -X DELETE "repos/$repo/git/refs/tags/dev" 2>/dev/null || true
            if gh release create dev dist/UltraFrontEnd.exe THIRD_PARTY_NOTICES.md --draft --prerelease --title "$title" \
                 --notes-file notes.md --target "$(git rev-parse HEAD)"; then
              exit 0
            fi
            echo "GitHub didn't take the release (try $try), trying again in a minute"
            sleep 60
          done
          exit 1
