<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ultra Front End Overlay</title>
<link rel="icon" href="icon.png">
<style>
  * { box-sizing: border-box; }
  /* 1rem is 1vh while the window is 46% of the screen height wide (as it is beside a landscape game), and less when a
     portrait screen makes it narrower, so the panel's contents scale to fit */
  html { font-size: min(1vh, 100vw / 45.8); }
  html, body { height: 100%; margin: 0; overflow: hidden; cursor: none; }
  body.glass { background: #1c1d1f center / 100% 100% no-repeat; }  /* the game behind, frosted, kept up to date (frontend.py) */
  body { background: #1c1d1f; color: #fff; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; opacity: 0; transition: opacity .16s ease-out; }
  body.on { opacity: 1; }
  #panel { position: absolute; inset: 0; padding: 5rem 1.6rem 3.6rem; display: flex; flex-direction: column; }  /* the window itself slides (frontend.py) */
  #top { display: flex; gap: 2.4rem; padding: 0 2.8rem; align-items: flex-end; margin-bottom: 3rem; }
  #cover { width: 11rem; height: 15rem; object-fit: cover; border-radius: 1rem; background: rgba(255, 255, 255, .06); flex: none; }
  #head { min-width: 0; flex: 1; }
  #clock { font-size: 2.6rem; }
  #date { font-size: 1.8rem; color: rgba(255, 255, 255, .62); margin-bottom: 1.6rem; }
  h1 { font-size: 3rem; line-height: 1.2; margin: 0; font-weight: 600; }
  #stats { font-size: 1.8rem; color: rgba(255, 255, 255, .62); margin-top: .4rem; }
  .item { display: flex; align-items: center; justify-content: space-between; min-height: 6.8rem; padding: .6rem 2.8rem; border-radius: 3.4rem; font-size: 2.6rem; }
  .item.sel { background: #fff; color: #0e1014; }
  .item.warn.sel { background: #dc2626; color: #fff; }  /* Close game: a red highlight, the label as the others */
  .item small { font-size: 2.2rem; opacity: .7; }
  .bar { height: .36rem; margin-top: 1rem; border-radius: .2rem; background: rgba(255, 255, 255, .22); }
  .bar i { display: block; height: 100%; border-radius: inherit; background: #fff; }
  .sel .bar { background: rgba(14, 16, 20, .2); }
  .sel .bar i { background: #0e1014; }
  .grow { flex: 1; min-width: 0; }
  .grow > div:first-child { display: flex; justify-content: space-between; }
  #info { margin-top: auto; padding: 2rem 2.8rem 0; display: flex; flex-direction: column; gap: 1.8rem; font-size: 2.3rem; }
  #info small { display: block; font-size: 1.8rem; color: rgba(255, 255, 255, .62); }
  #info div div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #media { display: flex; gap: 1rem; margin: 1.2rem 0 0 -1.4rem; }
  #media:empty { display: none; }
  #media b { width: 7.2rem; height: 5.4rem; border-radius: 2.7rem; display: grid; place-items: center; }
  #media svg { width: 2.8rem; height: 2.8rem; fill: currentColor; }
  #media.sel b.cur { background: #fff; color: #0e1014; }
  #foot { margin-top: 2.4rem; padding: 0 2.8rem; font-size: 1.7rem; color: rgba(255, 255, 255, .62); text-align: right; }
</style>
</head>
<body>
<div id="panel">
  <div id="top"><img id="cover" alt="" onerror="this.style.visibility='hidden'"><div id="head"><div id="clock"></div><div id="date"></div><h1 id="title"></h1><div id="stats"></div></div></div>
  <div id="menu"></div>
  <div id="info"><div><div id="song"></div><div id="media"></div></div><div id="battery"></div></div>
</div>
<script>
const $ = q => document.querySelector(q);
// The backdrop: a frosted frame of the game, several a second. Each is decoded before it's shown, so it never flickers.
function frost(url) {
  const img = new Image();
  img.onload = () => { document.body.classList.add('glass'); document.body.style.backgroundImage = `url(${url})`; };
  img.src = url;
}
let items = [], sel = 0, busy = false;
const hm = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
const post = action => fetch('/api/overlay', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Frontend': '1' }, body: JSON.stringify({ action }) });
// The music controls sit with the song at the bottom: the last stop going down, left and right between the three buttons.
const ICONS = {
  prev: '<svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>'
};
let music = null, mediaSel = 1;  // music: {playing} while Windows shows a song; mediaSel: previous, play/pause, next
function draw() {
  $('#menu').innerHTML = items.map((it, i) => it.media ? '' : `<div class="item${it.warn ? ' warn' : ''}${i === sel ? ' sel' : ''}" data-i="${i}">${it.volume ? `<div class="grow"><div>Volume<span>${volume}</span></div><div class="bar"><i style="width:${volume}%"></i></div></div>` : it.label}</div>`).join('');
  const box = $('#media');
  box.className = items[sel]?.media ? 'sel' : '';
  box.innerHTML = music ? [ICONS.prev, music.playing ? ICONS.pause : ICONS.play, ICONS.next].map((svg, i) => `<b class="${i === mediaSel ? 'cur' : ''}">${svg}</b>`).join('') : '';
}
function media() {
  const action = ['media-prev', 'media-play', 'media-next'][mediaSel];
  post(action);
  if (action === 'media-play') music.playing = !music.playing;  // shown straight away; Windows' own word follows
  draw();
  clearTimeout(media.t); media.t = setTimeout(song, 900);
}
function act(name) {
  if (name === 'up') sel = (sel + items.length - 1) % items.length;
  else if (name === 'down') sel = (sel + 1) % items.length;
  else if (name === 'left' || name === 'right') {
    if (items[sel]?.volume) setVolume((name === 'left' ? -1 : 1) * volumeStep());
    else if (items[sel]?.media) { mediaSel = Math.max(0, Math.min(2, mediaSel + (name === 'left' ? -1 : 1))); draw(); }
    return;
  }
  else if (name === 'ok') return items[sel]?.volume ? undefined : items[sel]?.media ? media() : go(items[sel]);
  else if (name === 'back' || name === 'dismiss') return go(items[0]);  // dismiss: View + Start again, from the helper
  draw();
}
let volume = null;
// 1% a press. Held, the press repeats (about 9 a second) and the steps grow, so a long hold crosses the range in a few seconds.
const volumeStep = () => {
  const t = performance.now();
  volumeStep.run = t - (volumeStep.at || 0) < 250 ? (volumeStep.run || 0) + 1 : 0;
  volumeStep.at = t;
  return volumeStep.run < 8 ? 1 : volumeStep.run < 20 ? 2 : 4;
};
async function setVolume(delta) {
  try {
    const r = await (await fetch('/api/volume', delta === undefined ? { cache: 'no-store' } : { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Frontend': '1' }, body: JSON.stringify({ delta }) })).json();
    if (r.volume == null) return;
    volume = r.volume;
    if (!items.some(x => x.volume)) { items.splice(1, 0, { volume: true }); if (sel >= 1) sel++; }  // the highlight stays on the same item
    draw();
  } catch {}
}
const title = t => t[0].toUpperCase() + t.slice(1);
const slide = show => Promise.race([window.pywebview?.api?.slide?.(show), new Promise(r => setTimeout(r, 600))]).catch(() => {});
async function go(it) {
  if (busy || !it) return;
  if (it.hud) {  // Off, Compact, Full: the menu stays open
    try { const r = await (await fetch('/api/hud', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Frontend': '1' }, body: '{}' })).json(); it.label = `Performance overlay: ${title(r.mode)}`; draw(); } catch {}
    return;
  }
  if (it.stay) {  // the menu stays open; say that it happened
    post(it.action); it.base ??= it.label; it.label = it.done; draw();  // base: a second press mustn't keep 'State saved' as the label
    clearTimeout(it.timer);
    return it.timer = setTimeout(() => { it.label = it.base; draw(); }, 1500);
  }
  busy = true;
  await slide(false);  // out of the way first, so it doesn't vanish all at once (or show up in a screenshot)
  // the helper closes this window; if it can't, come back rather than stay an invisible window on top, or close it here
  const away = setTimeout(() => window.pywebview?.api?.quit(), 5000);
  post(it.action).then(r => { if (!r.ok) throw r; }).catch(() => { clearTimeout(away); busy = false; slide(true); });
}
async function padLoop() {
  let seq = 1e12;
  for (;;) {
    try {
      const r = await (await fetch(`/api/pad?overlay=1&after=${seq}`, { cache: 'no-store' })).json();
      r.actions.forEach(a => once(a, 'pad') && act(a)); seq = r.seq;
    } catch { await new Promise(res => setTimeout(res, 1000)); }
  }
}
// Keys too, for a keyboard. But if this window ever has the focus, Steam types arrow keys for the same controller presses
// the helper reports, so a key soon after the helper's own report of that action (or the other way round) is the same press.
const lastAct = {};
const once = (name, from) => {
  const t = performance.now(), prev = lastAct[name];
  lastAct[name] = { t, from };
  return !(prev && prev.from !== from && t - prev.t < 250);
};
addEventListener('keydown', e => {
  const name = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'ok', ' ': 'ok', Escape: 'back', Backspace: 'back' }[e.key];
  if (name) { e.preventDefault(); if (!e.repeat && once(name, 'key')) act(name); }
});
async function song() {  // one at a time: each asks Windows through a PowerShell that can be slow
  clearTimeout(song.t);
  try {
    const n = await (await fetch('/api/nowplaying', { cache: 'no-store' })).json(), box = $('#song');
    box.textContent = '';
    music = n.title ? { playing: !!n.playing } : null;  // a paused song stays, so it can be played again
    const at = items.findIndex(x => x.media);
    if (music && at < 0) items.push({ media: true });
    if (!music && at >= 0) { items.splice(at, 1); if (sel >= items.length) sel = items.length - 1; }
    draw();
    if (!music) return;
    const label = document.createElement('small'), t = document.createElement('div');
    label.textContent = music.playing ? 'Now playing' : 'Paused'; t.textContent = n.title;
    box.append(label, t);
    if (n.artist) { const a = document.createElement('small'); a.textContent = n.artist; box.append(a); }
  } catch {} finally { song.t = setTimeout(song, 5000); }
}
let zone = {};  // the profile's time zone, as the frontend's clock uses
const clock = () => {
  const d = new Date();
  $('#clock').textContent = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', ...zone });
  $('#date').textContent = d.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', ...zone });
};
fetch('/api/profile', { cache: 'no-store' }).then(r => r.json()).then(p => {
  const z = p.timezone;
  if (z && z !== 'auto') { try { Intl.DateTimeFormat('en-US', { timeZone: z }); zone = { timeZone: z }; clock(); } catch {} }
}).catch(() => {});
(async () => {
  const s = await fetch('/api/overlay', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({}));  // the menu still works without the game's details
  $('#title').textContent = s.title || '';
  $('#stats').textContent = s.session >= 0 ? `This session ${hm(s.session)}` + (s.minutes ? ` · Total ${hm(s.minutes)}` : '') : '';
  if (s.cover) $('#cover').src = s.cover; else $('#cover').style.visibility = 'hidden';
  items = [{ label: 'Back to game', action: 'resume' },
    ...(s.savestate ? [{ label: 'Save state', action: 'savestate', stay: true, done: 'State saved' }, { label: 'Load state', action: 'loadstate', stay: true, done: 'State loaded' }] : []),
    { label: 'Take screenshot', action: 'screenshot' },
    { label: s.recording ? 'Stop recording' : 'Record video', action: 'record' },
    ...(s.hud ? [{ label: `Performance overlay: ${title(s.hud)}`, hud: true }] : []),  // an extra: only once PresentMon is installed
    { label: 'Close game', action: 'close', warn: true }];
  if (s.battery != null) $('#battery').innerHTML = `<small>Controller battery</small><div>${s.battery}%</div>`;
  if (!('hud' in s)) fetch('/api/hud', { cache: 'no-store' }).then(r => r.json()).then(r => {  // no state: asked for here, never guessed
    if (r.fps && r.mode && !items.some(x => x.hud)) { items.splice(items.length - 1, 0, { label: `Performance overlay: ${title(r.mode)}`, hud: true }); draw(); }
  }).catch(() => {});
  draw(); clock(); setInterval(clock, 5000); setVolume();
  document.body.classList.add('on');
  padLoop();
  song();
})();
</script>
</body>
</html>
