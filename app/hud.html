<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* glass: a soft frosted panel with a light edge and glow (the window itself is a little see-through too) */
  html, body { margin: 0; color: #f4f5f7; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; overflow: hidden; user-select: none; cursor: none; }
  body { background: radial-gradient(120% 140% at 0% 0%, rgba(120, 160, 255, .22), transparent 55%), radial-gradient(120% 140% at 100% 100%, rgba(80, 255, 190, .14), transparent 60%), linear-gradient(160deg, #2a2d36, #16181d 70%); }
  body::before { content: ''; position: fixed; inset: 0; border-radius: 1.6rem; pointer-events: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), inset 0 0 0 1px rgba(255, 255, 255, .1); }
  body::after { content: ''; position: fixed; left: 0; right: 0; top: 0; height: 45%; pointer-events: none; background: linear-gradient(rgba(255, 255, 255, .09), transparent); }
  #cards { position: relative; padding: 1.2rem 0; }
  .card { display: flex; align-items: center; gap: 1.6rem; padding: 1.2rem 2.2rem; animation: in .45s cubic-bezier(.2, .8, .2, 1) backwards; }
  .card + .card { border-top: 1px solid rgba(255, 255, 255, .08); }
  @keyframes in { from { opacity: 0; transform: translateY(-.6rem); } }
  .card svg { width: 3.2rem; height: 3.2rem; padding: .8rem; flex: none; border-radius: 1.2rem; background: rgba(255, 255, 255, .1); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
    fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .text { flex: 1; min-width: 0; }
  .text div { font-size: 2.3rem; font-weight: 600; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .text small { display: block; margin-top: .2rem; font-size: 1.7rem; color: rgba(255, 255, 255, .66); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  /* the progress bar: it grows smoothly, and a light sweeps along it while it's going */
  .bar { position: relative; height: .7rem; margin-top: 1rem; border-radius: .35rem; background: rgba(255, 255, 255, .14); overflow: hidden; box-shadow: inset 0 1px 1px rgba(0, 0, 0, .3); }
  .bar i { position: relative; display: block; height: 100%; border-radius: inherit; overflow: hidden; transition: width 1.2s cubic-bezier(.2, .8, .2, 1);
    background: linear-gradient(90deg, #7fb2ff, #7ff0c8); box-shadow: 0 0 1rem rgba(127, 220, 255, .6); }
  .bar i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .7), transparent); transform: translateX(-100%); animation: sweep 2.2s ease-in-out infinite; }
  .bar.full i::after { animation: none; }
  @keyframes sweep { to { transform: translateX(100%); } }
</style></head>
<body><div id="cards"></div>
<script>
document.documentElement.style.fontSize = `${screen.height / 100}px`;
// The in-game display: add-ons' cards, asked for every two seconds. Hidden while the in-game menu is open.
const ICON = {
  printer: '<path d="M7 9V4h10v5"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v6H7z"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>', music: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', pad: '<path d="M7 8h10a5 5 0 0 1 0 10l-2-2H9l-2 2A5 5 0 0 1 7 8z"/><path d="M8 11v4M6 13h4"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>', star: '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let last = '';
async function tick() {
  try {
    const r = await (await fetch('/api/addon-hud', { cache: 'no-store' })).json();
    if (r.quit) return window.pywebview?.api?.quit();
    const html = r.hidden ? '' : r.items.map(it => `<div class="card"><svg viewBox="0 0 24 24">${ICON[it.icon] || ICON.bolt}</svg><div class="text"><div>${esc(it.text)}</div>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}${it.progress != null ? `<div class="bar${it.progress >= 100 ? ' full' : ''}" data-p="${it.progress}"><i></i></div>` : ''}</div></div>`).join('');
    const shape = html.replace(/data-p="[^"]*"/g, '').replace(/<small>.*?<\/small>/g, '');
    if (shape !== last) {  // a new card or a new title: drawn again; otherwise only its words and bar change
      last = shape;
      document.getElementById('cards').innerHTML = html;
      document.getElementById('cards').style.display = html ? '' : 'none';
      // measured once it's laid out, with room to spare, so nothing is cut off at the bottom
    } else {
      const now = new DOMParser().parseFromString(`<div>${html}</div>`, 'text/html').body.firstChild.children;
      [...document.querySelectorAll('.card')].forEach((c, i) => { const n = now[i]; if (!n) return;
        const sm = c.querySelector('small'), ns = n.querySelector('small'); if (sm && ns) sm.textContent = ns.textContent;
        const b = c.querySelector('.bar'), nb = n.querySelector('.bar'); if (b && nb) { b.dataset.p = nb.dataset.p; b.className = nb.className; } });
    }
    document.querySelectorAll('.bar').forEach(b => { b.querySelector('i').style.width = `${b.dataset.p}%`; });
    if (html !== window.lastHtml) {
      window.lastHtml = html;
      requestAnimationFrame(() => window.pywebview?.api?.size(html ? Math.ceil(document.getElementById('cards').getBoundingClientRect().height) + 4 : 1));
    }
  } catch {}
}
window.addEventListener('pywebviewready', tick);
setInterval(tick, 2000);
tick();
</script></body></html>
