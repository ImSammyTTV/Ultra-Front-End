<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* A slim glass pill: a round picture, one line of words, and a thin glowing bar along the bottom edge. The window is
     cut to the pill's shape, so only the pill shows over the game. 1rem is set from the screen's height (see below). */
  html, body { margin: 0; color: #f4f5f7; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; overflow: hidden; user-select: none; cursor: none; }
  body { background: #1b1d23; }
  #cards { display: inline-flex; flex-direction: column; }
  .card { position: relative; display: flex; align-items: center; gap: 1.2rem; height: 6.2rem; box-sizing: border-box; padding: 0 2.4rem 0 .9rem; white-space: nowrap;
    background: radial-gradient(120% 220% at 0% 0%, rgba(120, 160, 255, .24), transparent 55%), radial-gradient(120% 220% at 100% 100%, rgba(80, 255, 190, .16), transparent 60%), linear-gradient(160deg, #2c2f38, #17191e 75%);
    animation: in .45s cubic-bezier(.2, .8, .2, 1) backwards; }
  .card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 48%; background: linear-gradient(rgba(255, 255, 255, .1), transparent); pointer-events: none; }
  .card + .card { border-top: 1px solid rgba(255, 255, 255, .08); }
  @keyframes in { from { opacity: 0; } }
  .pic, .card svg { width: 4.4rem; height: 4.4rem; flex: none; border-radius: 50%; }
  .pic { object-fit: contain; background: radial-gradient(circle at 50% 40%, #f4f6fa, #c9ced8); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6); }
  .card svg { box-sizing: border-box; padding: 1rem; background: rgba(255, 255, 255, .1); fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .t { font-size: 2rem; font-weight: 600; letter-spacing: .01em; }
  .t span { font-weight: 400; color: rgba(255, 255, 255, .7); font-variant-numeric: tabular-nums; }
  /* the bar: grows smoothly, and a light sweeps along it while it's going */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: .45rem; background: rgba(255, 255, 255, .12); }
  .bar i { position: relative; display: block; height: 100%; overflow: hidden; transition: width 1.2s cubic-bezier(.2, .8, .2, 1);
    background: linear-gradient(90deg, #7fb2ff, #7ff0c8); box-shadow: 0 0 1rem rgba(127, 220, 255, .7); }
  .bar i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .75), transparent); transform: translateX(-100%); animation: sweep 2.2s ease-in-out infinite; }
  .bar.full i::after { animation: none; }
  @keyframes sweep { to { transform: translateX(100%); } }
</style></head>
<body><div id="cards"></div>
<script>
// The in-game display: add-ons' cards, asked for every two seconds. Hidden while the in-game menu is open.
let size = 0;  // the card's scale, from the app (data/hud-card.json), so it can be tuned while it runs
const ICON = {
  printer: '<path d="M7 9V4h10v5"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v6H7z"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>', music: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', pad: '<path d="M7 8h10a5 5 0 0 1 0 10l-2-2H9l-2 2A5 5 0 0 1 7 8z"/><path d="M8 11v4M6 13h4"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>', star: '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cardHTML = it => `<div class="card">${it.image ? `<img class="pic" src="${esc(it.image)}" alt="">` : `<svg viewBox="0 0 24 24">${ICON[it.icon] || ICON.bolt}</svg>`}`
  + `<div class="t">${esc(it.text)}${it.sub ? ` <span>· ${esc(it.sub)}</span>` : ''}</div>`
  + `${it.progress != null ? `<div class="bar${it.progress >= 100 ? ' full' : ''}"><i style="width:${it.progress}%"></i></div>` : ''}</div>`;
let shape = '', drawn = '', place = 'top-left';
function fit() {  // the window takes the pill's size, and is cut to its rounded shape
  const box = document.getElementById('cards'), r = box.getBoundingClientRect();
  window.pywebview?.api?.size(box.children.length ? Math.ceil(r.height) : 1, box.children.length ? Math.ceil(r.width) : 1, Math.ceil(r.height / box.children.length || 1), place);
}
async function tick() {
  try {
    const r = await (await fetch('/api/addon-hud', { cache: 'no-store' })).json();
    if (r.quit) return window.pywebview?.api?.quit();
    if (r.size !== size) { size = r.size; shape = ''; document.documentElement.style.fontSize = `${screen.height / 118 * size}px`; }
    const items = r.hidden ? [] : r.items, box = document.getElementById('cards');
    const nextShape = items.map(it => `${it.image}|${it.icon}|${it.progress != null}`).join('\n');
    if (nextShape !== shape) {  // a new card: drawn again (fades in)
      shape = nextShape;
      box.innerHTML = items.map(cardHTML).join('');
    } else {  // the same card: only its words and bar change, so the bar glides
      [...box.children].forEach((c, i) => { const it = items[i];
        c.querySelector('.t').innerHTML = `${esc(it.text)}${it.sub ? ` <span>· ${esc(it.sub)}</span>` : ''}`;
        const b = c.querySelector('.bar'); if (b) { b.classList.toggle('full', it.progress >= 100); b.querySelector('i').style.width = `${it.progress}%`; } });
    }
    const now = items.map(it => `${it.text}|${it.sub}`).join('\n') + size;
    if (now !== drawn) { drawn = now; requestAnimationFrame(fit); }
  } catch {}
}
window.addEventListener('pywebviewready', tick);
setInterval(tick, 2000);
tick();
</script></body></html>
