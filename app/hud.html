<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: #141518; color: #f2f3f5; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; overflow: hidden; user-select: none; cursor: none; }
  #cards { padding: 1.4vh 0; }
  .card { display: flex; align-items: center; gap: 1.6vh; padding: 1.2vh 2vh; }
  .card + .card { border-top: 1px solid rgba(255, 255, 255, .08); }
  .card svg { width: 3.4vh; height: 3.4vh; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .text { flex: 1; min-width: 0; }
  .text div { font-size: 2.3vh; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .text small { display: block; font-size: 1.8vh; color: rgba(255, 255, 255, .62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: .5vh; margin-top: .8vh; border-radius: .25vh; background: rgba(255, 255, 255, .18); overflow: hidden; }
  .bar i { display: block; height: 100%; background: #fff; border-radius: inherit; transition: width .6s ease; }
</style></head>
<body><div id="cards"></div>
<script>
// The in-game display: add-ons' cards, asked for every two seconds. Hidden while the in-game menu is open.
const ICON = {
  printer: '<path d="M7 9V4h10v5"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v6H7z"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>', music: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', pad: '<path d="M7 8h10a5 5 0 0 1 0 10l-2-2H9l-2 2A5 5 0 0 1 7 8z"/><path d="M8 11v4M6 13h4"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>', star: '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let last = '';
async function tick() {
  try {
    const r = await (await fetch('/api/hud', { cache: 'no-store' })).json();
    if (r.quit) return window.pywebview?.api?.quit();
    const html = r.hidden ? '' : r.items.map(it => `<div class="card"><svg viewBox="0 0 24 24">${ICON[it.icon] || ICON.bolt}</svg><div class="text"><div>${esc(it.text)}</div>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}${it.progress != null ? `<div class="bar"><i style="width:${it.progress}%"></i></div>` : ''}</div></div>`).join('');
    if (html !== last) {
      last = html;
      document.getElementById('cards').innerHTML = html;
      document.getElementById('cards').style.display = html ? '' : 'none';
      window.pywebview?.api?.size(html ? document.getElementById('cards').offsetHeight : 1);
    }
  } catch {}
}
window.addEventListener('pywebviewready', tick);
setInterval(tick, 2000);
tick();
</script></body></html>
