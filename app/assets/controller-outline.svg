<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 615" width="830" height="615">
  <!-- Original illustration of a generic twin-stick, twin-trackpad controller. Drawn from basic shapes for Ultra Front End. MIT. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3340"/><stop offset=".45" stop-color="#1b2029"/><stop offset="1" stop-color="#161a21"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".5" cy="0" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4250"/><stop offset="1" stop-color="#1d222b"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3643"/><stop offset="1" stop-color="#171b22"/>
    </linearGradient>
    <radialGradient id="cap" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#1a1e25"/><stop offset=".7" stop-color="#262c36"/><stop offset="1" stop-color="#3a4250"/>
    </radialGradient>
    <radialGradient id="well" cx=".5" cy=".5" r=".5">
      <stop offset=".72" stop-color="#0b0d11"/><stop offset="1" stop-color="#1a1e25"/>
    </radialGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14171d"/><stop offset="1" stop-color="#20252e"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <clipPath id="bodyclip"><path d="M 415 44 L 215 44 C 150 44 108 52 84 84 C 58 120 42 196 38 276 C 34 372 48 476 78 556 C 94 598 148 612 182 586 C 212 562 232 512 262 484 C 292 458 342 454 415 454 C 488 454 538 458 568 484 C 598 512 618 562 648 586 C 682 612 736 598 752 556 C 782 476 796 372 792 276 C 788 196 772 120 746 84 C 722 52 680 44 615 44 L 415 44 Z"/></clipPath>
  </defs>

  <!-- triggers (behind the shell, outer shoulders) -->
  <g fill="url(#shoulder)" stroke="#fff" stroke-opacity=".12" stroke-width="1.5">
    <path d="M 62 92 C 62 56 84 40 118 40 L 140 40 C 148 40 150 48 146 58 L 132 92 Z"/>
    <path d="M 768 92 C 768 56 746 40 712 40 L 690 40 C 682 40 680 48 684 58 L 698 92 Z"/>
  </g>
  <!-- bumpers along the top edge -->
  <g fill="url(#shoulder)" stroke="#fff" stroke-opacity=".14" stroke-width="1.5">
    <rect x="112" y="26" width="112" height="24" rx="12"/>
    <rect x="606" y="26" width="112" height="24" rx="12"/>
  </g>

  <!-- shell -->
  <path d="M 415 44 L 215 44 C 150 44 108 52 84 84 C 58 120 42 196 38 276 C 34 372 48 476 78 556 C 94 598 148 612 182 586 C 212 562 232 512 262 484 C 292 458 342 454 415 454 C 488 454 538 458 568 484 C 598 512 618 562 648 586 C 682 612 736 598 752 556 C 782 476 796 372 792 276 C 788 196 772 120 746 84 C 722 52 680 44 615 44 L 415 44 Z" fill="url(#body)" filter="url(#soft)"/>
  <path d="M 415 44 L 215 44 C 150 44 108 52 84 84 C 58 120 42 196 38 276 C 34 372 48 476 78 556 C 94 598 148 612 182 586 C 212 562 232 512 262 484 C 292 458 342 454 415 454 C 488 454 538 458 568 484 C 598 512 618 562 648 586 C 682 612 736 598 752 556 C 782 476 796 372 792 276 C 788 196 772 120 746 84 C 722 52 680 44 615 44 L 415 44 Z" fill="url(#sheen)"/>
  <path d="M 415 44 L 215 44 C 150 44 108 52 84 84 C 58 120 42 196 38 276 C 34 372 48 476 78 556 C 94 598 148 612 182 586 C 212 562 232 512 262 484 C 292 458 342 454 415 454 C 488 454 538 458 568 484 C 598 512 618 562 648 586 C 682 612 736 598 752 556 C 782 476 796 372 792 276 C 788 196 772 120 746 84 C 722 52 680 44 615 44 L 415 44 Z" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <!-- lower face panel, slightly recessed -->
  <g clip-path="url(#bodyclip)">
    <path d="M 168 262 Q 168 238 192 238 L 638 238 Q 662 238 662 262 L 662 418 Q 662 438 640 440 Q 415 462 190 440 Q 168 438 168 418 Z"
          fill="#000" fill-opacity=".16" stroke="#fff" stroke-opacity=".05" stroke-width="1.5"/>
  </g>

  <!-- back grip buttons (on the rear, shown at the sides) -->
  <g fill="#1d222b" stroke="#fff" stroke-opacity=".16" stroke-width="1.5">
    <rect x="30" y="226" width="30" height="48" rx="10"/>
    <rect x="30" y="286" width="30" height="48" rx="10"/>
    <rect x="770" y="226" width="30" height="48" rx="10"/>
    <rect x="770" y="286" width="30" height="48" rx="10"/>
  </g>

  <!-- D-pad -->
  <circle cx="168" cy="135" r="64" fill="#000" fill-opacity=".18"/>
  <path d="M 150 83 L 186 83 L 186 117 L 220 117 L 220 153 L 186 153 L 186 187 L 150 187 L 150 153 L 116 153 L 116 117 L 150 117 Z" fill="url(#key)" stroke="#fff" stroke-opacity=".14" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="168" cy="135" r="9" fill="#000" fill-opacity=".25"/>
  <g fill="#fff" fill-opacity=".18">
    <path d="M 168 94 l 6 8 h -12 Z"/><path d="M 168 176 l 6 -8 h -12 Z"/>
    <path d="M 127 135 l 8 -6 v 12 Z"/><path d="M 209 135 l -8 -6 v 12 Z"/>
  </g>

  <!-- face buttons -->
  <circle cx="659" cy="131" r="68" fill="#000" fill-opacity=".18"/>
  <g fill="url(#key)" stroke="#fff" stroke-opacity=".16" stroke-width="1.5">
    <circle cx="660" cy="173" r="22"/><circle cx="706" cy="134" r="22"/>
    <circle cx="613" cy="130" r="22"/><circle cx="659" cy="88" r="22"/>
  </g>

  <!-- View and Menu -->
  <g fill="url(#key)" stroke="#fff" stroke-opacity=".14" stroke-width="1.5">
    <rect x="248" y="68" width="48" height="20" rx="10"/>
    <rect x="530" y="68" width="48" height="20" rx="10"/>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5">
    <rect x="264" y="73" width="10" height="7" rx="1.5"/><rect x="269" y="76" width="10" height="7" rx="1.5"/>
    <path d="M 547 74 h 14 M 547 78 h 14 M 547 82 h 14"/>
  </g>

  <!-- centre button with a status light -->
  <circle cx="413" cy="132" r="26" fill="#000" fill-opacity=".25"/>
  <circle cx="413" cy="132" r="21" fill="url(#key)" stroke="#fff" stroke-opacity=".18" stroke-width="1.5"/>
  <circle cx="413" cy="132" r="8" fill="none" stroke="#38bdf8" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="413" cy="70" r="3" fill="#38bdf8" fill-opacity=".7"/>

  <!-- sticks -->
  <g>
    <circle cx="300" cy="180" r="52" fill="url(#well)"/>
    <circle cx="530" cy="180" r="52" fill="url(#well)"/>
    <circle cx="300" cy="180" r="40" fill="#20252e" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/>
    <circle cx="530" cy="180" r="40" fill="#20252e" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/>
    <circle cx="300" cy="180" r="33" fill="url(#cap)" stroke="#fff" stroke-opacity=".2" stroke-width="1.5"/>
    <circle cx="530" cy="180" r="33" fill="url(#cap)" stroke="#fff" stroke-opacity=".2" stroke-width="1.5"/>
  </g>

  <!-- square trackpads -->
  <g stroke="#fff" stroke-opacity=".12" stroke-width="1.5">
    <rect x="198" y="276" width="128" height="128" rx="22" fill="url(#pad)"/>
    <rect x="501" y="276" width="128" height="128" rx="22" fill="url(#pad)"/>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="1">
    <rect x="208" y="286" width="108" height="108" rx="16"/>
    <rect x="511" y="286" width="108" height="108" rx="16"/>
  </g>

  <!-- quick-access button between the pads -->
  <rect x="390" y="330" width="46" height="20" rx="10" fill="url(#key)" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/>
  <g fill="#fff" fill-opacity=".45"><circle cx="403" cy="340" r="2"/><circle cx="413" cy="340" r="2"/><circle cx="423" cy="340" r="2"/></g>
</svg>
